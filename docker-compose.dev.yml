version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: teamlens-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamlens
      POSTGRES_PASSWORD: teamlens_dev
      POSTGRES_DB: teamlens_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamlens -d teamlens_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Go Backend API
  backend:
    build:
      context: ../backend-go
      dockerfile: Dockerfile
    container_name: teamlens-backend-dev
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: teamlens
      DATABASE_PASSWORD: teamlens_dev
      DATABASE_NAME: teamlens_dev
      JWT_SECRET: dev_jwt_secret_not_for_production
      JWT_ACCESS_TTL: 30d
      JWT_AGENT_TTL: 30d
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001"
      WEB_APP_URL: "http://localhost:3000"
      SCREENSHOT_AI_GRPC_HOST: screenshot-ai
      SCREENSHOT_AI_GRPC_PORT: 50051
      ALERT_SERVICE_HOST: alert-service
      ALERT_SERVICE_GRPC_PORT: 50052
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - uploads_dev:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # WebSocket Service
  ws:
    build:
      context: ../backend-ws
      dockerfile: Dockerfile
    container_name: teamlens-ws-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4001
      DATABASE_URL: "postgresql://teamlens:teamlens_dev@postgres:5432/teamlens_dev?schema=public"
      JWT_SECRET: dev_jwt_secret_not_for_production
      JWT_ACCESS_TTL: 12h
      JWT_AGENT_TTL: 30d
      INVITE_TTL_HOURS: 72
      WEB_APP_URL: "http://localhost:3000"
      WEBRTC_ICE_SERVERS: '[{"urls":["stun:stun.l.google.com:19302"]}]'
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  # Next.js Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: teamlens-frontend-dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
      NEXT_PUBLIC_WS_URL: "http://localhost:4001"
      NEXT_PUBLIC_POSTHOG_KEY: "${NEXT_PUBLIC_POSTHOG_KEY:-}"
      NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - ws

  # Screenshot AI Service
  screenshot-ai:
    build:
      context: ../screenshot-ai
      dockerfile: Dockerfile
    container_name: teamlens-screenshot-ai-dev
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      HF_TOKEN: ${HF_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HTTP_PORT: 8000
      GRPC_PORT: 50051
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
    ports:
      - "8000:8000"
      - "50051:50051"

  # Alert Service
  alert-service:
    build:
      context: ../alert-service
      dockerfile: Dockerfile
    container_name: teamlens-alert-dev
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: teamlens
      DATABASE_PASSWORD: teamlens_dev
      DATABASE_NAME: teamlens_dev
      JWT_SECRET: dev_jwt_secret_not_for_production
      UPLOAD_DIR: /app/uploads
      SCREENSHOT_AI_HOST: screenshot-ai
      SCREENSHOT_AI_PORT: 50051
      HTTP_PORT: 8082
      GRPC_PORT: 50052
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8082:8082"
      - "50052:50052"
    volumes:
      - uploads_dev:/app/uploads
    depends_on:
      - postgres

  # Redis (for future use)
  redis:
    image: redis:7-alpine
    container_name: teamlens-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  uploads_dev:
  redis_dev_data:
